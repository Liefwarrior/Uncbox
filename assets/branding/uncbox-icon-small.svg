<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="140 140 744 744">
  <!-- Uncbox app icon for small sizes (taskbar, tray, 48 px and under): the tile from uncbox-icon-tile.svg
       with just "Unc", larger, and a thicker edge, since "119" and "Uncbox" are unreadable that small. -->
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a7a"/>
      <stop offset="1" stop-color="#e3b955"/>
    </linearGradient>
  </defs>

  <rect x="168" y="168" width="688" height="688" rx="96" fill="#161922" stroke="url(#edge)" stroke-width="48"/>

  <text x="512" y="626" text-anchor="middle" font-family="Segoe UI" font-weight="700" font-size="330" letter-spacing="-12" fill="#f4f1ea">Unc</text>
</svg>
