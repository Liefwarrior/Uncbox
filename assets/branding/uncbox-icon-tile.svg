<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="140 140 744 744">
  <!-- Uncbox app icon, just the tile: transparent outside the gradient edge. Same drawing as uncbox-icon.svg. "Unc" as a periodic-table element. Element 119 is the next one nobody has made. -->
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a7a"/>
      <stop offset="1" stop-color="#e3b955"/>
    </linearGradient>
  </defs>

  <rect x="160" y="160" width="704" height="704" rx="60" fill="#161922" stroke="url(#edge)" stroke-width="16"/>

  <text x="218" y="276" font-family="Segoe UI" font-weight="600" font-size="70" fill="#e3b955">119</text>
  <text x="512" y="618" text-anchor="middle" font-family="Segoe UI" font-weight="700" font-size="300" letter-spacing="-7" fill="#f4f1ea">Unc</text>
  <text x="512" y="760" text-anchor="middle" font-family="Segoe UI" font-weight="600" font-size="68" letter-spacing="2" fill="#a3aaba">Uncbox</text>
</svg>
