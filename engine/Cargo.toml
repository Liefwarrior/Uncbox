[package]
name = "uncbox-stream"
version = "0.1.0"
edition = "2021"
description = "Uncbox's own streaming engine: screen or scene capture, GPU encode and RTMP, in one small program."
license = "MIT"
publish = false

[lib]
name = "uncbox_stream"
path = "src/lib.rs"

[[bin]]
name = "uncbox-stream"
path = "src/main.rs"

[dependencies]
serde_json = "1"
native-tls = "0.2"

# Only the Windows parts use it, so the plain-data parts (and their tests) build anywhere.
[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Performance",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Media",
  "Win32_System_WindowsProgramming",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
